<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yinops Render</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="studio">
    <aside class="rail" aria-label="Yinops Render navigation">
      <a class="brand" href="#create">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Yinops<em>Render</em></span>
      </a>
      <nav class="rail-nav" aria-label="Studio">
        <button class="rail-item active" type="button" data-view="create">
          <span class="rail-icon" aria-hidden="true">✦</span><span>創作</span>
        </button>
        <button class="rail-item" type="button" data-view="gallery">
          <span class="rail-icon" aria-hidden="true">▤</span><span>作品</span>
        </button>
      </nav>
      <div class="rail-foot">
        <span id="connection" class="pill pill-neutral">檢查中</span>
        <button id="sign-out" class="ghost" type="button" hidden>登出</button>
      </div>
    </aside>

    <main class="stage">
      <!-- ============ AUTH ============ -->
      <section id="auth-view" class="auth-view">
        <div class="auth-panel">
          <h1>歡迎返嚟</h1>
          <p class="auth-sub">私人生成工作台。用已存在嘅帳戶登入；呢個頁面唔會建立新帳戶。</p>
          <form id="auth-form" class="auth-form" autocomplete="on">
            <label class="field">
              <span>Email</span>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com">
            </label>
            <label class="field">
              <span>密碼</span>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="帳戶密碼">
            </label>
            <div class="auth-row">
              <button id="auth-submit" class="cta" type="submit">登入</button>
              <button id="auth-link" class="ghost" type="button">改用郵件連結</button>
            </div>
            <p id="auth-note" class="note" role="status"></p>
          </form>
        </div>
      </section>

      <!-- ============ CREATE ============ -->
      <section id="create-view" class="create-view" hidden>
        <header class="stage-head">
          <div>
            <p class="eyebrow" id="headline-note">載入登入狀態。</p>
            <h1 id="stage-title">創作</h1>
          </div>
          <button id="new-job" class="cta" type="button" disabled>新增創作</button>
        </header>

        <!-- readiness strip -->
        <div id="readiness-strip" class="strip" hidden>
          <span class="strip-item"><b id="released-preset-count">—</b> 已放行模型</span>
          <span class="strip-item"><b id="active-job-count">—</b> 進行中</span>
          <span class="strip-item"><b id="latest-result">—</b> 已驗證結果</span>
          <span id="readiness-note" class="strip-note"></span>
        </div>

        <div class="composer-wrap">
          <!-- mode tabs -->
          <div class="modes" role="tablist" aria-label="創作模式">
            <button class="mode active" type="button" data-mode="image" role="tab" aria-selected="true">
              <span class="mode-icon" aria-hidden="true">▣</span>
              <span class="mode-text"><b>圖片</b><small>Text → Image</small></span>
            </button>
            <button class="mode" type="button" data-mode="video" role="tab" aria-selected="false">
              <span class="mode-icon" aria-hidden="true">▶</span>
              <span class="mode-text"><b>影片</b><small>Text → Video</small></span>
            </button>
            <button class="mode" type="button" data-mode="edit" role="tab" aria-selected="false">
              <span class="mode-icon" aria-hidden="true">✎</span>
              <span class="mode-text"><b>編輯</b><small>上載相片／影片</small></span>
            </button>
          </div>

          <!-- upload zone (edit mode) -->
          <div id="upload-zone" class="upload" hidden>
            <div id="upload-drop" class="upload-drop" tabindex="0" role="button" aria-label="上載相片或影片">
              <span class="upload-art" aria-hidden="true">⇪</span>
              <b>Drop 你嘅相片或影片</b>
              <small>拖放檔案，或者撳一下揀選 · 圖片 PNG/JPEG/WebP · 影片 MP4</small>
              <input id="upload-input" type="file" accept="image/png,image/jpeg,image/webp,video/mp4" hidden>
            </div>
            <div id="upload-preview" class="upload-preview" hidden></div>
            <p id="upload-note" class="note">揀到嘅媒體會做本地預覽同 hash 核對；目前放行嘅模型未接受輸入媒體時會如實標明。</p>
          </div>

          <!-- composer -->
          <form id="job-form" class="composer">
            <div class="prompt-wrap">
              <textarea id="prompt" rows="4" placeholder="形容你想生成嘅畫面…&#10;例如：黃昏維港，長椅上放住一排紅葉，電影感光線，淺景深" required disabled></textarea>
              <div class="prompt-meta">
                <span id="prompt-count">0 / 4000</span>
              </div>
            </div>

            <div class="controls">
              <label class="control">
                <span>模型</span>
                <select id="preset" disabled></select>
              </label>
              <label class="control control-narrow">
                <span>闊</span>
                <input id="width" type="number" disabled>
              </label>
              <label class="control control-narrow">
                <span>高</span>
                <input id="height" type="number" disabled>
              </label>
              <label class="control control-narrow">
                <span>Seed</span>
                <input id="seed" type="number" disabled>
              </label>
              <button id="submit-job" class="cta cta-wide" type="submit" disabled>生成</button>
            </div>
            <div id="preset-facts" class="facts"></div>
            <p id="form-note" class="note" role="status"></p>
          </form>
        </div>

        <!-- ============ GALLERY ============ -->
        <section id="queue-card" class="gallery" hidden>
          <header class="gallery-head">
            <h2>作品同進度</h2>
            <div class="gallery-stats">
              <span class="pill pill-neutral"><b id="queued-count">—</b> 排隊</span>
              <span class="pill pill-neutral"><b id="running-count">—</b> 生成中</span>
              <button id="refresh-jobs" class="ghost" type="button">重新整理</button>
            </div>
          </header>
          <div id="jobs" class="gallery-grid"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
